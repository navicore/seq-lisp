name: Deep CI

# Runs the self-hosted TCO suite at depth 10000 (~10 min). Kept out of
# routine `just ci` so PR feedback stays fast. Triggered on PRs against
# main and on demand via the Actions tab.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deep-tco:
    name: Deep TCO (self-hosted, depth 10000)
    runs-on: navicore-rust
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          just --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: linux-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache seqc binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/seqc
          key: linux-seqc-7.4.0

      - name: Install seqc
        run: |
          if ! command -v seqc >/dev/null; then
            cargo install seq-compiler --force
          fi
          seqc --version

      - name: Run deep TCO suite
        run: just deep-tco
