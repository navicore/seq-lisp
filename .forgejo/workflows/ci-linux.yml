name: CI - Linux

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# This workflow only calls `just` commands. The justfile is the source
# of truth for all build/test logic, preventing drift between local
# development and CI.
#
# `runs-on: navicore-rust` targets the custom job image at
# git.navicore.tech/navicore/navicore-forgejo-runner:latest, which has
# Rust, clang, and just pre-installed. Do NOT add a
# dtolnay/rust-toolchain step — act mirrors third-party actions from
# data.forgejo.org, which does not host that action.

jobs:
  ci-linux:
    name: CI - Linux x86_64
    runs-on: navicore-rust

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          rustc --version
          cargo --version
          just --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: linux-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: linux-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Install seqc (latest)
        # seqc tracks the latest released version on crates.io.
        # `cargo install seq-compiler --force` always pulls latest, so
        # there is no version pin to maintain here. We deliberately do
        # NOT cache the binary — a static cache key would silently pin
        # us to a stale seqc, and `command -v` would then skip the
        # upgrade. The cargo registry/git caches below keep the build
        # fast by avoiding crate re-downloads.
        run: |
          cargo install seq-compiler --force
          seqc --version

      - name: Run CI checks (just ci)
        run: just ci
